<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pedalboard 3 · Main Window (v2 — grounded)</title>
<link rel="stylesheet" href="mw2.css" />
<link rel="stylesheet" href="nam.css" />
<link rel="stylesheet" href="nam-browser.css" />
<style>
  html, body { margin: 0; height: 100%; background: #07070d; overflow: hidden; }
  #fit { position: fixed; inset: 0; display: grid; place-items: center; }
  #scale { width: 1560px; height: 946px; transform-origin: center; }
  #scale .mw2 { border-radius: 14px; box-shadow: 0 40px 110px rgba(0,0,0,0.7); overflow: hidden; }
</style>
</head>
<body>
<div id="fit"><div id="scale"><div id="root"></div></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="mw2-data.jsx"></script>
<script type="text/babel" src="mw2-prims.jsx"></script>
<script type="text/babel" src="mw2-nodes.jsx"></script>
<script type="text/babel" src="mw2-canvas.jsx"></script>
<script type="text/babel" src="mw2-chrome.jsx"></script>
<script type="text/babel" src="nam-controls.jsx"></script>
<script type="text/babel" src="nam-editor.jsx"></script>
<script type="text/babel" src="nam-browser-data.jsx"></script>
<script type="text/babel" src="nam-browser.jsx"></script>
<script type="text/babel" src="nam-window.jsx"></script>
<script type="text/babel" src="mw2-app.jsx"></script>

<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("root")).render(<MainWindow2 />);
  function fit() {
    const s = document.getElementById("scale");
    const k = Math.min(window.innerWidth / 1560, window.innerHeight / 946);
    if (k > 0 && isFinite(k)) s.style.transform = "scale(" + k + ")";
  }
  window.addEventListener("resize", fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  fit();
  requestAnimationFrame(fit);
</script>
</body>
</html>
